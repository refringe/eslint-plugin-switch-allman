name: Bug Report
description: Report a bug or unexpected behavior
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Source code
      description: The smallest switch statement that reproduces the problem.
      render: javascript
      placeholder: |
        switch (x)
        {
            case 1: {
                break;
            }
        }
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: ESLint configuration
      description: The relevant part of your eslint.config.js or .eslintrc.
      render: javascript
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect the rule to report or autofix?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What did the rule actually report or autofix?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plugin version
      description: eslint-plugin-switch-allman version.
      placeholder: v1.1.0
    validations:
      required: true

  - type: input
    id: eslint-version
    attributes:
      label: ESLint version
      description: Output of `npx eslint --version`.
      placeholder: v10.8.1
    validations:
      required: true

  - type: dropdown
    id: config-format
    attributes:
      label: Configuration format
      options:
        - Flat config (eslint.config.js)
        - Legacy config (.eslintrc)
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Logs / additional context
      description: Paste any relevant output or additional context.
      render: shell
    validations:
      required: false
