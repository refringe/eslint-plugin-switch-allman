name: Quality

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the lockfile is in sync
        run: |
          git diff --exit-code package-lock.json

      - name: 'Verify no local file: or link: dependency'
        run: |
          if grep -qE '"(file|link):' package.json; then
            echo "ERROR: package.json contains a local file:/link: dependency."
            echo "Remove it before releasing."
            exit 1
          fi

      - name: Verify the published package contents
        run: npm pack --dry-run

      - name: Lint
        run: npm run lint
